name: Unit Tests

# NOTE: The triggers below are shaped for iterating on the testing-harness
# branch. Before upstreaming, reshape them to the usual pattern of the other
# workflows in this repository (push + pull_request on main with the same
# paths: filters).
on:
  workflow_dispatch:
  push:
    branches: [ testing-harness ]
    paths:
      - 'src/**'
      - '.github/workflows/unit-tests.yml'

permissions:
  contents: read

env:
  # Same Qt 6 version and aqtinstall pinning as the autobuild workflow's
  # macOS/Windows builds (.github/autobuild/mac.sh, windows.ps1) -- Qt is
  # installed the same way here (see the "Install Qt (aqtinstall, ...)"
  # steps below) so this exercises the same Qt build upstream ships.
  # Linux jobs use the distro Qt packages instead (see matrix below).
  QT_VERSION: 6.10.2
  AQTINSTALL_VERSION: 3.3.0

  # gcovr version used by the coverage job below (pinned the same way as
  # AQTINSTALL_VERSION above, for the same reason: reproducible output).
  GCOVR_VERSION: 8.6

jobs:
  unit-tests:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # `id` is a short, stable slug (no spaces/parens, unlike `name`)
          # used for per-job artifact names (junit-<id>, see the "Upload
          # JUnit XML" step below) so parallel matrix jobs never collide.
          #
          # Oldest supported Qt line: distro Qt 5.15 proves the Qt >= 5.12
          # compatibility floor of the test suite.
          - name: Linux (Qt 5, ubuntu-22.04)
            id: linux-qt5
            runs_on: ubuntu-22.04
            qt_packages: qtbase5-dev qt5-qmake
            qmake: qmake
          - name: Linux (Qt 6, ubuntu-24.04)
            id: linux-qt6
            runs_on: ubuntu-24.04
            qt_packages: qt6-base-dev
            qmake: qmake6
          # macos-15 with Xcode 16.3.0 mirrors the autobuild workflow's macOS
          # configuration; the Xcode 26 toolchain of newer images cannot
          # compile the Qt 6 headers yet (implicit __yield declaration error).
          - name: macOS (Qt 6)
            id: macos-qt6
            runs_on: macos-15
            xcode_version: 16.3.0
            qmake: qmake
          - name: Windows (Qt 6, MSVC)
            id: windows-qt6
            runs_on: windows-latest
            qmake: qmake

          # Same Qt6/ubuntu-24.04 toolchain as the plain Linux Qt6 job above,
          # but compiled with GCC's sanitizers to catch memory/UB issues a
          # plain build wouldn't. The flags are appended on the qmake command
          # line (qmake_extra_args, used by the Build unit tests (Unix) step
          # below) rather than edited into test.pro, so no other job is
          # affected.
          - name: Linux (Qt 6, ASan/UBSan)
            id: linux-qt6-asan
            runs_on: ubuntu-24.04
            qt_packages: qt6-base-dev
            qmake: qmake6
            qmake_extra_args: >-
              QMAKE_CXXFLAGS+="-fsanitize=address,undefined"
              QMAKE_LFLAGS+="-fsanitize=address,undefined"

          # Same Qt6/ubuntu-24.04 toolchain again, this time built with GCC's
          # --coverage flag (gcov instrumentation compiled into protocol.o/
          # util.o/tst_protocol.o) so a line/function/branch coverage report
          # can be generated once the suite has run. The `coverage: true`
          # field is only read by the two extra steps at the end of this job
          # (Generate/Upload coverage report); every other step ignores it.
          - name: Linux (Qt 6, coverage)
            id: linux-qt6-coverage
            runs_on: ubuntu-24.04
            qt_packages: qt6-base-dev
            qmake: qmake6
            coverage: true
            qmake_extra_args: >-
              QMAKE_CXXFLAGS+="--coverage"
              QMAKE_LFLAGS+="--coverage"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Qt (Linux distro packages)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq --no-install-recommends -y install ${{ matrix.config.qt_packages }}

      - name: Select Xcode version
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.6.0
        with:
          xcode-version: ${{ matrix.config.xcode_version }}

      - name: Cache Qt (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/qt
          key: macos-qt-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/unit-tests.yml') }}

      - name: Cache Qt (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\Qt
          key: windows-qt-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/unit-tests.yml') }}

      # Same install mechanism as the autobuild workflow's Ensure-Qt
      # (.github/autobuild/mac.sh: venv + pip install aqtinstall + aqt
      # install-qt), trimmed to just the qtbase archive -- this test suite
      # only needs QtCore/QtNetwork/QtTest (CONFIG += testcase, QT -= gui
      # in src/test/test.pro), not qttools/qttranslations/qtmultimedia.
      - name: Install Qt (aqtinstall, macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d ~/qt ]; then
            echo "Using Qt installation from previous run (actions/cache)"
          else
            python3 -m venv venv
            source venv/bin/activate
            pip install "aqtinstall==${{ env.AQTINSTALL_VERSION }}"
            python3 -m aqt install-qt --outputdir ~/qt mac desktop "${{ env.QT_VERSION }}" --archives qtbase
            deactivate
            rm -rf venv
          fi
          # Same PATH setup as build_app_as_dmg_installer() in mac.sh (macos/
          # is the Qt6 layout, clang_64/ is Qt5's; only one will exist here).
          echo "$HOME/qt/${{ env.QT_VERSION }}/macos/bin" >> "$GITHUB_PATH"
          echo "$HOME/qt/${{ env.QT_VERSION }}/clang_64/bin" >> "$GITHUB_PATH"

      # Same install mechanism as the autobuild workflow's Ensure-Qt
      # (.github/autobuild/windows.ps1: pip install aqtinstall + aqt
      # install-qt), trimmed to just the qtbase archive for the same reason
      # as the macOS step above.
      - name: Install Qt (aqtinstall, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -Path C:\Qt) {
            Write-Host "Using Qt installation from previous run (actions/cache)"
          } else {
            pip install "aqtinstall==$env:AQTINSTALL_VERSION"
            aqt install-qt --outputdir C:\Qt windows desktop $env:QT_VERSION win64_msvc2022_64 --archives qtbase
          }
          # Same bin directory layout as windows.ps1/deploy_windows.ps1 use
          # ("$QtInstallPath\$QtCompile\bin" with QtCompile64=msvc2022_64).
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Qt\$env:QT_VERSION\msvc2022_64\bin"

      - name: Build unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir build-test
          cd build-test
          ${{ matrix.config.qmake }} ../src/test/test.pro ${{ matrix.config.qmake_extra_args }}
          make -j"$(nproc 2> /dev/null || sysctl -n hw.logicalcpu)"

      # ilammy/msvc-dev-cmd (its latest release and even its unreleased
      # default branch) still targets Node.js 20, which GitHub Actions now
      # runs forced onto Node 24 with a deprecation warning; there's no
      # node24 release to bump to. Set up the MSVC environment directly
      # instead, replicating what that action actually does under the
      # hood (proven to work on this exact runner): call vcvarsall.bat in
      # a plain "cmd /c" subshell, diff its "set" output against a
      # before-snapshot to find just the variables it changed, and apply
      # those to this step's own environment. This is more robust than
      # simply "call"-ing vcvarsall.bat inline, which left
      # VCToolsInstallDir unset here even though vcvarsall.bat reported
      # success -- some part of its own environment-propagation logic
      # doesn't survive being invoked from within a nested CALL.
      - name: Build unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvarsall = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'

          $before = cmd /c "set"
          $after  = cmd /c "call `"$vcvarsall`" x64 >nul && set"

          $beforeMap = @{}
          foreach ($line in $before) {
            if ($line -match '^([^=]+)=(.*)$') { $beforeMap[$Matches[1]] = $Matches[2] }
          }
          foreach ($line in $after) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]; $value = $Matches[2]
              if ($beforeMap[$name] -ne $value) {
                [System.Environment]::SetEnvironmentVariable($name, $value)
              }
            }
          }

          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"
          where.exe cl

          mkdir build-test
          cd build-test
          qmake ..\src\test\test.pro "CONFIG-=debug_and_release" "CONFIG+=release" "DESTDIR=."
          nmake

      # Output is captured to a file and grepped for the QtTest "Totals:"
      # summary line, so the job fails if the suite ever exits 0 without
      # actually having run its tests (rather than trusting the exit code
      # alone). QtTest supports multiple "-o file,format" loggers in the same
      # run, so the existing plain text logger (still what the Totals: gate
      # greps) gets a second junit-flavoured one alongside it for the
      # "Summarize test results" step below. The format name QtTest uses for
      # that flavour changed between Qt 5 and Qt 6 (5.15 calls it
      # "xunitxml", 6.x renamed it "junitxml") -- rather than hardcode that
      # by matrix.config.qmake, ask the binary itself via -help so this
      # keeps working if the name changes again.
      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        env:
          # No-ops on the plain (non-sanitized) builds; on the ASan/UBSan job
          # this makes any sanitizer report abort the process immediately
          # instead of just printing a diagnostic and exiting 0, so the
          # Totals: gate below can't be fooled by a report that arrives after
          # all tests otherwise "pass".
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          JUNIT_FORMAT=junitxml
          ./build-test/jamulus-test -help 2>&1 | grep -q junitxml || JUNIT_FORMAT=xunitxml
          echo "Using QtTest JUnit logger format: $JUNIT_FORMAT"

          # "-o -,txt" keeps the plain text report on stdout (so it still
          # reaches the console and, via tee, test-output.txt for the grep
          # below) alongside the new junit logger writing straight to its own
          # file; passing any -o at all replaces QtTest's implicit default
          # logger, so the stdout one has to be requested explicitly here.
          ./build-test/jamulus-test -o -,txt -o test-results.xml,$JUNIT_FORMAT | tee test-output.txt
          grep -q 'Totals: 46 passed' test-output.txt

      # gcda/gcno files land next to the .o files inside build-test/ (test.pro
      # doesn't set OBJECTS_DIR, so out-of-tree still means "flat inside the
      # build dir"). --filter is anchored to "src/<single path segment>.cpp"
      # so it only ever matches protocol.cpp/util.cpp directly under src/ --
      # src/test/tst_protocol.cpp (an extra path segment) and the moc_*.cpp
      # generated sources (which live under build-test/, not src/) are both
      # excluded automatically without needing a separate --exclude.
      # gcovr is run once, producing all three outputs the ticket asked for:
      # an HTML report (uploaded as an artifact below), a per-file Markdown
      # table (appended to the job summary), and the overall percentages
      # (printed to the log via --print-summary).
      - name: Generate coverage report
        if: matrix.config.coverage
        run: |
          mkdir coverage-html
          pipx run "gcovr==${{ env.GCOVR_VERSION }}" \
            --root "$GITHUB_WORKSPACE" \
            --filter "$GITHUB_WORKSPACE/src/[^/]+\.cpp$" \
            --object-directory build-test \
            --html-details coverage-html/index.html \
            --markdown coverage-summary.md \
            --print-summary
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.config.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 31
          if-no-files-found: error

      # The test suite's own stdout came back completely empty here (0
      # bytes) no matter how it was captured -- cmd redirection, pwsh
      # Tee-Object, pwsh *> -- even though the exe demonstrably ran (exit
      # code 0, ~50ms). Rather than continue to chase whichever console/
      # pipe layer is eating the writes on this runner, sidestep the
      # process's stdout stream entirely: QTest's own "-o file,txt" option
      # makes it write its plain-text report straight to a file via Qt's
      # file I/O, independent of the console/output-handle machinery.
      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set JUNIT_FORMAT=junitxml
          build-test\jamulus-test.exe -help | findstr /C:"junitxml" >nul
          if errorlevel 1 set JUNIT_FORMAT=xunitxml
          echo Using QtTest JUnit logger format: %JUNIT_FORMAT%

          build-test\jamulus-test.exe -o test-output.txt,txt -o test-results.xml,%JUNIT_FORMAT%
          set EXE_EXITCODE=%ERRORLEVEL%
          type test-output.txt
          findstr /C:"Totals: 46 passed" test-output.txt > nul
          if errorlevel 1 (
            echo ##[error]Expected 'Totals: 46 passed' not found in captured test output
            exit /b 1
          )
          if not "%EXE_EXITCODE%"=="0" (
            echo ##[error]jamulus-test.exe exited with code %EXE_EXITCODE%
            exit /b %EXE_EXITCODE%
          )

      # Zero-permission route: a python (stdlib only, no third party action)
      # step parses the junit xml written by both Run unit tests steps above
      # and appends a compact pass/fail table to the job summary. The
      # alternative -- dorny/test-reporter or mikepenz/action-junit-report,
      # which render much richer per-test annotations/check runs -- needs
      # `checks: write` (dorny) or `pull-requests: write`/`checks: write`
      # (mikepenz), neither of which this workflow's `permissions: contents:
      # read` grants; widening that (and, for a fork PR's GITHUB_TOKEN,
      # trusting a third-party action with it) was judged more than a test
      # summary is worth, especially for a spike. `if: always()` so this
      # (and the upload step below) still run -- and show what did get as
      # far as being recorded -- even if the Totals: gate above failed.
      - name: Summarize test results
        if: always()
        shell: python
        env:
          JOB_NAME: ${{ matrix.config.name }}
        run: |
          import os
          import xml.etree.ElementTree as ET

          path = "test-results.xml"
          job_name = os.environ.get ( "JOB_NAME", "unit tests" )

          with open ( os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8" ) as summary:
              summary.write ( "### JUnit results: {}\n\n".format ( job_name ) )

              if not os.path.exists ( path ):
                  summary.write ( "_No test-results.xml was produced (the build or test run likely failed before it could be written)._\n\n" )
              else:
                  root = ET.parse ( path ).getroot()
                  suites = [ root ] if root.tag == "testsuite" else list ( root.findall ( "testsuite" ) )

                  summary.write ( "| Suite | Tests | Passed | Failed | Skipped | Time (s) |\n" )
                  summary.write ( "|---|---|---|---|---|---|\n" )

                  failures = []
                  for suite in suites:
                      tests   = int ( suite.get ( "tests", 0 ) )
                      failed  = int ( suite.get ( "failures", 0 ) ) + int ( suite.get ( "errors", 0 ) )
                      skipped = int ( suite.get ( "skipped", 0 ) )
                      passed  = tests - failed - skipped
                      status  = "PASS" if failed == 0 else "FAIL"
                      summary.write ( "| {} {} | {} | {} | {} | {} | {} |\n".format (
                          status, suite.get ( "name" ), tests, passed, failed, skipped, suite.get ( "time", "?" ) ) )

                      for testcase in suite.findall ( "testcase" ):
                          node = testcase.find ( "failure" )
                          if node is None:
                              node = testcase.find ( "error" )
                          if node is not None:
                              failures.append ( ( testcase.get ( "name" ), ( node.get ( "message" ) or "" ).strip() ) )

                  if failures:
                      summary.write ( "\n<details><summary>Failed tests</summary>\n\n" )
                      for name, message in failures:
                          summary.write ( "- `{}`: {}\n".format ( name, message ) )
                      summary.write ( "\n</details>\n" )

                  summary.write ( "\n" )

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.config.id }}
          path: test-results.xml
          retention-days: 31
          if-no-files-found: warn
